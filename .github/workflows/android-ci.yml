name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pull requests can originate from untrusted forks; no write token is needed.
permissions:
  contents: read

jobs:
  verify:
    name: Unit tests, debug APK, and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests, assemble debug APK, and lint
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
